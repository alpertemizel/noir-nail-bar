spring.application.name=noir-nail-bar

# PostgreSQL Veritabanı Yapılandırması
spring.datasource.url=jdbc:postgresql://localhost:5432/noir_nail_bar_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Ayarları (Üretimde JWT_SECRET ortam değişkeni ile override edilir)
jwt.secret=${JWT_SECRET:noir-nail-bar-super-secret-key-for-local-dev-only-min-256bit}
jwt.expiration-ms=86400000

# Jackson 3.x (tools.jackson) — ISO-8601 date serialization is the default; no extra config needed.

# Google Gemini (Spring AI Güncel Yapılandırması)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.7